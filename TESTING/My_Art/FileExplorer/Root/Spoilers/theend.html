<!-- Title -->
<script>
  let TitleText = "Katy sat in a deskchair and Katy looked at the sun. Katy ate an ice-cream and Katy looked like fun.";
  let position = 0;

  function scrollTitle() {
    document.title = TitleText.substring(position) + TitleText.substring(0, position);
    position = (position + 1) % TitleText
    .length;
  }

  setInterval(scrollTitle, 150);
</script>

<!-- Bounce-->
<script>
  const images = document.querySelectorAll('.bouncingtext')
  images.forEach(img => {
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;

    let dx = (Math.random() * 0.5) + 0.2;
    let dy = (Math.random() * 0.5) + 0.2;

    const rect = img.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;
    
    function move() {
      x = x + dx;
      y = y + dy;

      if (x + rect.width >= window.innerWidth || x <= 0) {dx = dx * -1;}
      if (y + rect.height >= window.innerHeight || y <= 0) {dy = dy * -1;}

      img.style.transform = `translate(${x}px, ${y}px)`;

      requestAnimationFrame(move);
    }

    move();
  });
</script>
